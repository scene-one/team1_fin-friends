<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #EFEAE1; }
    a { color: #B36B3A; text-decoration: none; }
    a:hover { color: #8E5228; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; min-height: 930px; background: #FAF7F1; color: #2A2724; font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column;">

  <div style="padding: 26px 20px 0 20px;">
    <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em;">오늘 배울 것</div>
  </div>

  <div style="margin: 18px 20px 0 20px; background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 18px; padding: 17px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 13px; font-weight: 800;">매일 오기</div>
      <div style="display: flex; align-items: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.2 14.7 9l6.3.8-4.6 4.3 1.2 6.2L12 17.4 6.4 20.3l1.2-6.2L3 9.8 9.3 9z" fill="#E8B978" stroke="#B36B3A" stroke-width="1.4" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 800; color: #8E5228;">오늘 +1</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; background: {{d.bg}}; border: {{d.border}}; display: flex; align-items: center; justify-content: center;">
            <div style="width: 11px; height: 11px; border-radius: 4px; background: {{d.dot}};"></div>
          </div>
          <span style="font-size: 10px; color: {{d.labelColor}}; font-weight: 700;">{{d.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 22px 20px 11px 20px; font-size: 15px; font-weight: 800; letter-spacing: -0.01em;">네 가지 주제</div>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 9px;">
    <div style="background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 16px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 12px; background: #F7EEE6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.4" fill="#F0D9A8" stroke="#B36B3A" stroke-width="1.8"></circle>
          <path d="M12 7.6v8.8M9.4 10h4.2a1.9 1.9 0 0 1 0 3.8h-4" stroke="#B36B3A" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em;">벌기</span>
          <span style="font-size: 11px; color: #6B655D;">4 / 5</span>
        </div>
        <div style="font-size: 12px; color: #6B655D;">일하면 돈이 생겨요</div>
        <div style="height: 6px; border-radius: 999px; background: #EFEAE1; overflow: hidden;"><div style="height: 100%; width: 80%; background: #B36B3A; border-radius: 999px;"></div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 16px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 12px; background: #F7EEE6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3.5 5h2.2l2.5 9.6h9.4l2-6.8H7" stroke="#B36B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="10" cy="18.6" r="1.6" fill="#B36B3A"></circle>
          <circle cx="16.6" cy="18.6" r="1.6" fill="#B36B3A"></circle>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em;">잘 쓰기</span>
          <span style="font-size: 11px; color: #6B655D;">3 / 5</span>
        </div>
        <div style="font-size: 12px; color: #6B655D;">진짜 필요한 걸까?</div>
        <div style="height: 6px; border-radius: 999px; background: #EFEAE1; overflow: hidden;"><div style="height: 100%; width: 62%; background: #B36B3A; border-radius: 999px;"></div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 16px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 12px; background: #F7EEE6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M6.5 8.5h11v9.6a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2z" fill="#F0D9A8" stroke="#B36B3A" stroke-width="1.8" stroke-linejoin="round"></path>
          <path d="M5.6 5.6h12.8v2.9H5.6z" fill="none" stroke="#B36B3A" stroke-width="1.8"></path>
          <path d="M12 11.8v4.6M10 14.1h4" stroke="#B36B3A" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em;">모으기</span>
          <span style="font-size: 11px; color: #6B655D;">1 / 5</span>
        </div>
        <div style="font-size: 12px; color: #6B655D;">안 쓰고 두면 쌓여요</div>
        <div style="height: 6px; border-radius: 999px; background: #EFEAE1; overflow: hidden;"><div style="height: 100%; width: 25%; background: #B36B3A; border-radius: 999px;"></div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1.5px solid #4F7A4A; border-radius: 16px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 42px; height: 42px; border-radius: 12px; background: #EDF1EA; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 20.5V10" stroke="#3E6B3A" stroke-width="2" stroke-linecap="round"></path>
          <path d="M12 13c-2-6-7-6.6-9.4-4.8.9 5.2 5.2 7.6 9.4 4.8z" fill="#8FB07F" stroke="#3E6B3A" stroke-width="1.7" stroke-linejoin="round"></path>
          <path d="M12 10c2-6 7-6.6 9.4-4.8-.9 5.2-5.2 7.6-9.4 4.8z" fill="#8FB07F" stroke="#3E6B3A" stroke-width="1.7" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.02em;">불리기</span>
          <span style="font-size: 11px; font-weight: 800; color: #3E6B3A;">지금 여기</span>
        </div>
        <div style="font-size: 12px; color: #4E6B4A;">모아두면 <b>저절로</b> 늘어나요</div>
        <div style="height: 6px; border-radius: 999px; background: #E1E8DC; overflow: hidden;"><div style="height: 100%; width: 10%; background: #4F7A4A; border-radius: 999px;"></div></div>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 0 20px; background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 11px; letter-spacing: 0.08em; color: #9C948A; font-weight: 700;">방금 푼 문제</div>
      <div style="display: flex; align-items: center; gap: 5px; background: #F7EEE6; border-radius: 999px; padding: 5px 10px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.2 14.7 9l6.3.8-4.6 4.3 1.2 6.2L12 17.4 6.4 20.3l1.2-6.2L3 9.8 9.3 9z" fill="#E8B978" stroke="#B36B3A" stroke-width="1.4" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 11px; font-weight: 800; color: #8E5228;">+1</span>
      </div>
    </div>
    <div style="font-size: 15px; font-weight: 700; line-height: 1.5;">10,000원을 1년 동안 두면<br>이자로 얼마가 늘어날까요?</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #EDF1EA; border: 1.5px solid #4F7A4A;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
        <path d="M5 12.5 10 17.5 19.5 7" stroke="#3E6B3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 14px; font-weight: 800; color: #2F5A2C;">300원쯤</span>
    </div>
    <div style="font-size: 12.5px; line-height: 1.6; color: #6B655D;">맞아요. 은행에 두면 <b>아무것도 안 해도</b> 조금씩 늘어나요. 부모님 적금은 더 많이 줄 수도 있어요.</div>
  </div>

  <div style="flex-grow: 1; min-height: 16px;"></div>

  <div style="margin-top: 16px; border-top: 1px solid #E5DFD5; background: #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" stroke="#9C948A" stroke-width="1.8" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 700; color: #9C948A;">홈</span>
    </div>
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z" fill="#F2E4D6" stroke="#B36B3A" stroke-width="1.8" stroke-linejoin="round"></path>
        <path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z" fill="#F2E4D6" stroke="#B36B3A" stroke-width="1.8" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 800; color: #B36B3A;">학습</span>
    </div>
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="6" width="18" height="13" rx="2" stroke="#9C948A" stroke-width="1.8"></rect>
        <path d="M3 10.5h18" stroke="#9C948A" stroke-width="1.8"></path>
        <circle cx="16.5" cy="15" r="1.6" fill="#9C948A"></circle>
      </svg>
      <span style="font-size: 10px; font-weight: 700; color: #9C948A;">내 통장</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"streak":{"editor":"int","default":7,"min":1,"max":7,"unit":"일","section":"출석"},"$preview":{"width":390,"height":930}}'>
class Component extends DCLogic {
  renderVals() {
    const streak = this.props.streak ?? 7;
    const labels = ['월', '화', '수', '목', '금', '토', '일'];
    return {
      days: labels.map((label, i) => {
        const done = i < streak;
        const today = i === streak - 1;
        return {
          label,
          bg: today ? '#F7EEE6' : done ? '#FDF7F0' : '#FAF7F1',
          border: today ? '2px solid #B36B3A' : '1px solid #E5DFD5',
          dot: done ? '#E8B978' : '#E5DFD5',
          labelColor: done ? '#8E5228' : '#B5AEA5'
        };
      })
    };
  }
}
</script>
</body>
</html>
