<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #EFEAE1; }
    a { color: #B36B3A; text-decoration: none; }
    a:hover { color: #8E5228; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #2E332C; color: #F6F3ED; font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; padding: 0 20px;">

  <div style="height: 96px;"></div>

  <div style="display: flex; align-items: center; gap: 9px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 21c0-6 4.5-6.8 4.5-11.4A4.5 4.5 0 0 0 12 5a4.5 4.5 0 0 0-4.5 4.6C7.5 14.2 12 15 12 21z" fill="#8FB07F" stroke="#8FB07F" stroke-width="1.6" stroke-linejoin="round"></path>
      <circle cx="12" cy="9.6" r="1.7" fill="#2E332C"></circle>
    </svg>
    <div style="font-size: 12px; letter-spacing: 0.1em; color: #A9B5A2; font-weight: 700;">잠깐만요</div>
  </div>

  <div style="margin-top: 16px; font-family: 'Apple SD Gothic Neo', sans-serif; font-size: 31px; font-weight: 800; line-height: 1.32; letter-spacing: -0.03em; text-wrap: pretty;">
    다이소에<br><span style="color: #E8B978;">{{dwell}}분</span> 있었어요.<br>사려던 거 있어요?
  </div>

  <div style="margin-top: 26px; padding: 18px; border-radius: 18px; background: #3A4137; border: 1px solid #4C5548; display: flex; flex-direction: column; gap: 15px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; color: #A9B5A2; font-weight: 700;">오늘 여기서 쓸 수 있는 돈</div>
      <div style="font-family: 'Hoefler Text', Palatino, serif; font-size: 25px; font-weight: 600; color: #F6F3ED;">{{planLabel}}<span style="font-size: 15px; font-family: 'Apple SD Gothic Neo', sans-serif; font-weight: 700;">원</span></div>
    </div>
    <div style="height: 1px; background: #4C5548;"></div>
    <div style="display: flex; gap: 13px; align-items: flex-start;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
        <circle cx="12" cy="12" r="9.2" fill="#4A5245" stroke="#8FB07F" stroke-width="1.5"></circle>
        <path d="M12 6.6v5.6l3.4 2.2" stroke="#8FB07F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 15px; font-weight: 800; line-height: 1.4; letter-spacing: -0.02em;">지금 다 쓰면 자전거가<br><span style="color: #E8B978;">3주</span> 늦어져요</div>
        <div style="font-size: 12px; color: #A9B5A2; line-height: 1.5;">모은 돈 36,000원 · 자전거까지 84,000원 남음</div>
      </div>
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-size: 11px; color: #8B9784; font-weight: 700; letter-spacing: 0.04em;">모으기 진행</div>
    <div style="height: 12px; border-radius: 999px; background: #3A4137; overflow: hidden; display: flex;">
      <div style="width: 30%; background: #8FB07F;"></div>
      <div style="width: 8%; background: #6E7C68;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 10px; color: #8B9784;">
      <span>지금 30%</span>
      <span style="color: #C9A46C;">여기서 쓰면 22%로 내려가요</span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 24px;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="padding: 17px; border-radius: 14px; background: #8FB07F; color: #22271F; font-size: 16px; font-weight: 800; text-align: center; letter-spacing: -0.01em; cursor: pointer;">계획대로 할게요</div>
    <div style="padding: 17px; border-radius: 14px; background: transparent; border: 1px solid #5A6455; color: #C4CEBE; font-size: 15px; font-weight: 700; text-align: center; cursor: pointer;">그래도 둘러볼게요</div>
  </div>

  <div style="margin: 18px 0 30px 0; display: flex; gap: 8px; align-items: flex-start;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 2px;">
      <rect x="4.5" y="10.5" width="15" height="9.5" rx="2" stroke="#7E8A78" stroke-width="1.7"></rect>
      <path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" stroke="#7E8A78" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
    <div style="font-size: 10.5px; line-height: 1.55; color: #7E8A78;">여기 있는지는 <b style="color: #9AA694;">내 휴대폰 안에서만</b> 확인해요. 어디에 있었는지는 <b style="color: #9AA694;">저장하지 않아요.</b> 알림을 끄고 싶으면 부모님과 함께 설정에서 끌 수 있어요.</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dwell":{"editor":"int","default":3,"min":1,"max":15,"unit":"분","section":"트리거"},"plan":{"editor":"int","default":5000,"min":1000,"max":50000,"step":1000,"unit":"원","section":"계획"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const plan = this.props.plan ?? 5000;
    return {
      dwell: this.props.dwell ?? 3,
      planLabel: plan.toLocaleString('ko-KR')
    };
  }
}
</script>
</body>
</html>
