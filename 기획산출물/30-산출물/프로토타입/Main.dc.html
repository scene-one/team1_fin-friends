<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #EFEAE1; }
    a { color: #B36B3A; text-decoration: none; }
    a:hover { color: #8E5228; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #FAF7F1; color: #2A2724; font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 14px 20px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-size: 12px; letter-spacing: 0.08em; color: #9C948A; font-weight: 600;">오늘의 별</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="align-self: center;">
          <path d="M12 3.2 14.7 9l6.3.8-4.6 4.3 1.2 6.2L12 17.4 6.4 20.3l1.2-6.2L3 9.8 9.3 9z" fill="#E8B978" stroke="#B36B3A" stroke-width="1.4" stroke-linejoin="round"></path>
        </svg>
        <span style="font-family: 'Hoefler Text', 'Iowan Old Style', Palatino, serif; font-size: 38px; font-weight: 600; line-height: 1;">{{stars}}</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #F7EEE6; border: 1px solid #E6D3C0; border-radius: 999px; padding: 7px 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5 10 17.5 19.5 7" stroke="#B36B3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 700; color: #8E5228;">출석 완료</span>
      </div>
      <div style="font-size: 11px; color: #9C948A;">7일 연속</div>
    </div>
  </div>

  <div style="margin: 0 20px; background: #FFFFFF; border: 1px solid #E5DFD5; border-radius: 20px; padding: 18px 18px 20px 18px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; font-weight: 700; letter-spacing: -0.01em;">내 친구</div>
      <div style="display: flex; align-items: center; gap: 5px; color: #9C948A;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6" stroke="#9C948A" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M17 3.5v3.4h-3.4M7 20.5v-3.4h3.4" stroke="#9C948A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 11px;">돌려보기</span>
      </div>
    </div>

    <div style="position: relative; height: 226px; border-radius: 16px; background: #F4F6F1; border: 1px solid #E3E8DE; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;">
      <div style="position: absolute; top: 10px; left: 12px; font-size: 10px; letter-spacing: 0.1em; color: #A8B29F; font-weight: 700;">3D 에셋 자리</div>
      <svg width="200" height="200" viewBox="0 0 200 200" fill="none" style="margin-bottom: 6px;">
        <ellipse cx="100" cy="182" rx="52" ry="8" fill="#DDE4D7"></ellipse>
        <path d="M52 96c0-26 21-47 48-47s48 21 48 47v18c0 26-21 47-48 47s-48-21-48-47z" fill="#E9A063" stroke="#8E5228" stroke-width="3"></path>
        <path d="M58 74 46 38l32 14z" fill="#E9A063" stroke="#8E5228" stroke-width="3" stroke-linejoin="round"></path>
        <path d="M142 74l12-36-32 14z" fill="#E9A063" stroke="#8E5228" stroke-width="3" stroke-linejoin="round"></path>
        <path d="M64 118c0 22 16 38 36 38s36-16 36-38z" fill="#FBF3E7" stroke="#8E5228" stroke-width="3"></path>
        <circle cx="82" cy="106" r="5.5" fill="#2A2724"></circle>
        <circle cx="118" cy="106" r="5.5" fill="#2A2724"></circle>
        <path d="M100 126v6" stroke="#8E5228" stroke-width="3" stroke-linecap="round"></path>
        <path d="M92 138q8 7 16 0" stroke="#8E5228" stroke-width="3" stroke-linecap="round"></path>
        <path d="M56 148q44 16 88 0l-6 16q-38 13-76 0z" fill="#4F7A4A" stroke="#2F5A2C" stroke-width="3" stroke-linejoin="round"></path>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 13px; font-weight: 700;">다음 옷까지</div>
        <div style="font-size: 13px;"><span style="font-family: 'Hoefler Text', Palatino, serif; font-size: 17px; font-weight: 600; color: #B36B3A;">{{remaining}}</span><span style="color: #6B655D;">개 더</span></div>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #EFEAE1; overflow: hidden;">
        <div style="height: 100%; width: {{progressPct}}%; border-radius: 999px; background: #B36B3A;"></div>
      </div>
    </div>
  </div>

  <div style="padding: 22px 20px 12px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em;">옷장</div>
    <div style="font-size: 12px; color: #9C948A;">가진 것 3 · 잠긴 것 5</div>
  </div>

  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
      <div onClick="{{item.pick}}" style="cursor: pointer; background: {{item.bg}}; border: {{item.border}}; border-radius: 14px; padding: 9px 5px 8px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <div style="width: 34px; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center;">
          <div style="width: 18px; height: 18px; border-radius: 5px; background: {{item.swatch}};"></div>
        </div>
        <div style="font-size: 10px; font-weight: 700; color: {{item.labelColor}}; text-align: center; line-height: 1.2;">{{item.name}}</div>
        <div style="display: flex; align-items: center; gap: 2px;">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none">
            <path d="M12 3.2 14.7 9l6.3.8-4.6 4.3 1.2 6.2L12 17.4 6.4 20.3l1.2-6.2L3 9.8 9.3 9z" fill="{{item.starFill}}"></path>
          </svg>
          <span style="font-size: 10px; font-family: 'Hoefler Text', Palatino, serif; color: {{item.priceColor}};">{{item.price}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="margin: 18px 20px 0 20px; padding: 12px 14px; border-radius: 12px; background: #F4F6F1; border: 1px solid #E3E8DE; display: flex; gap: 9px; align-items: flex-start;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px;">
      <path d="M12 21c0-6 4-6 4-11a4 4 0 0 0-8 0c0 5 4 5 4 11z" fill="#CFDCC8" stroke="#4F7A4A" stroke-width="1.6" stroke-linejoin="round"></path>
    </svg>
    <div style="font-size: 11px; line-height: 1.5; color: #4E6B4A;">별은 <b>모으기만</b> 할 수 있어요. 옷을 살 때만 줄어들고, 그것 말고는 <b>없어지지 않아요.</b></div>
  </div>

  <div style="margin-top: 16px; border-top: 1px solid #E5DFD5; background: #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="#F2E4D6" stroke="#B36B3A" stroke-width="1.8" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 800; color: #B36B3A;">홈</span>
    </div>
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z" stroke="#9C948A" stroke-width="1.8" stroke-linejoin="round"></path>
        <path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z" stroke="#9C948A" stroke-width="1.8" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 10px; font-weight: 700; color: #9C948A;">학습</span>
    </div>
    <div style="padding: 12px 0 16px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="6" width="18" height="13" rx="2.5" stroke="#9C948A" stroke-width="1.8"></rect>
        <path d="M3 10.5h18" stroke="#9C948A" stroke-width="1.8"></path>
        <circle cx="16.5" cy="15" r="1.6" fill="#9C948A"></circle>
      </svg>
      <span style="font-size: 10px; font-weight: 700; color: #9C948A;">내 통장</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"stars":{"editor":"int","default":12,"min":0,"max":99,"unit":"개","section":"별"},"nextCost":{"editor":"int","default":15,"min":1,"max":99,"unit":"개","section":"별"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'scarf' };
  }
  renderVals() {
    const stars = this.props.stars ?? 12;
    const cost = this.props.nextCost ?? 15;
    const remaining = Math.max(0, cost - stars);
    const raw = [
      { id: 'scarf', name: '초록 목도리', price: 8, swatch: '#4F7A4A', owned: true },
      { id: 'cap', name: '밀짚모자', price: 10, swatch: '#D8B87A', owned: true },
      { id: 'vest', name: '데님 조끼', price: 12, swatch: '#7E93AC', owned: true },
      { id: 'boots', name: '노랑 장화', price: 15, swatch: '#E2B23C', owned: false },
      { id: 'bag', name: '가죽 가방', price: 18, swatch: '#8E5228', owned: false },
      { id: 'coat', name: '겨울 코트', price: 22, swatch: '#5C6B7A', owned: false },
      { id: 'scarf2', name: '체크 스카프', price: 26, swatch: '#B36B3A', owned: false },
      { id: 'crown', name: '나뭇잎 왕관', price: 30, swatch: '#3E6B3A', owned: false }
    ];
    const items = raw.map((it) => {
      const sel = this.state.picked === it.id;
      const can = it.owned || stars >= it.price;
      return {
        ...it,
        bg: sel ? '#F7EEE6' : can ? '#FFFFFF' : '#F4F1EB',
        border: sel ? '2px solid #B36B3A' : '1px solid #E5DFD5',
        labelColor: can ? '#2A2724' : '#A8A199',
        priceColor: can ? '#6B655D' : '#B5AEA5',
        starFill: can ? '#E8B978' : '#D8D2C8',
        pick: () => this.setState({ picked: it.id })
      };
    });
    return {
      stars,
      remaining,
      progressPct: Math.min(100, Math.round((stars / cost) * 100)),
      items
    };
  }
}
</script>
</body>
</html>
